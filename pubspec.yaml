name: untitled30
description: "A new Flutter project."
publish_to: 'none' # منع النشر على pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  # Flutter UI
  cupertino_icons: ^1.0.8
  flutter_svg:
  lottie: ^3.2.0
  fl_chart: 1.0.0
  lucide_icons: ^0.257.0
